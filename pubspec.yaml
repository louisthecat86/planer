name: produktion_planer
description: "Produktionsplanungs-Tool für den Fleischbereich. Offline-first."
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"
dependencies:
  flutter:
    sdk: flutter
  # State Management
  flutter_riverpod: ^2.6.1
  # Datenbank (lokal, offline-first)
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  # Navigation
  go_router: ^14.2.7
  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.0
  excel: ^4.0.6
  file_picker: ^11.0.2
  # Excel-Export (ZIP/XML-Manipulation für formaterhaltenden Export,
  # genutzt von excel_export_service_v3.dart)
  archive: ^3.6.1
  xml: ^6.5.0
  printing: ^5.14.3
  pdf: ^3.12.0
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  # Code-Generierung — wird ausschließlich für drift gebraucht.
  build_runner: ^2.5.4
  drift_dev: ^2.28.0

flutter:
  uses-material-design: true
  assets:
    - assets/intro/steak_blue.png
