name: erfassung
description: >-
  Planer Erfassung — die Android-App zum Produktions Planer: Produktionen,
  Maschineneinstellungen und Fotos direkt an der Anlage erfassen, ohne
  Netz.
publish_to: none
version: 1.6.0+8

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # Das Austauschformat mit dem Planer — dasselbe Paket nutzt der Planer.
  erfassung_format:
    path: ../packages/erfassung_format
  # Paket öffnen und Ergebnis speichern über den Dateidialog von Android.
  file_picker: ^11.0.0
  # Fotos: ruft die Kamera-App des Handys auf und bekommt das Bild
  # verkleinert zurück — ohne Kamera-Berechtigung, ohne Netz.
  image_picker: ^1.1.2
  # Der Ordner der App für den Stand der Erfassung und die Fotos.
  path_provider: ^2.1.0

# Ab 2.3.0 holt path_provider_android den Ordner der App über JNI — im
# Release-Build findet es dabei die Klasse android.content.Context nicht,
# und die App erreicht ihren Speicher nicht („ClassNotFoundException:
# Landroid/content/Context;"). 2.2.23 ist die letzte Fassung ohne JNI.
# Erst lösen, wenn eine neuere Fassung nachweislich im Release-Build läuft.
dependency_overrides:
  path_provider_android: 2.2.23

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
