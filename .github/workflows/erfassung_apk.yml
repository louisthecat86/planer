name: Erfassung APK

on:
  push:
    branches: [main]
    paths:
      - 'erfassung_app/**'
      - 'packages/erfassung_format/**'
      - '.github/workflows/erfassung_apk.yml'
  workflow_dispatch:

jobs:
  apk:
    name: Analyse, APK & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erfassung_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyse
        run: flutter analyze

      - name: Schlüssel zum Signieren (falls hinterlegt)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Kein Schlüssel hinterlegt — die APK wird mit dem Debug-Schlüssel signiert."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: APK bauen
        run: flutter build apk --release

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: planer-erfassung-apk
          path: erfassung_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Test
        run: flutter test
