name: Flutter CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  analyze:
    name: Analyse, Codegen, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true
      - name: Flutter version
        run: flutter --version
      # Die Tests legen eine SQLite-Datenbank im Arbeitsspeicher an. Anders
      # als in der App kommt die Bibliothek dabei nicht aus
      # sqlite3_flutter_libs (das ist ein Flutter-Plugin und steht im
      # Test-Prozess nicht zur Verfügung), sondern vom System.
      - name: SQLite bereitstellen
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0
      - name: Pub get
        run: flutter pub get
      - name: Code-Generierung (drift)
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyse
        run: flutter analyze
      - name: Test
        run: flutter test
